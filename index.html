<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#081F3B" />
    <meta name="description" content="Digital business card for Silina Salman — Marketing Assistant at Orbex." />
    <title>Silina Salman — Orbex</title>

    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg: #081F3B;
            --brand-accent: #00C9FF;
            --brand-accent-hover: #33D6FF;
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.10);
            --glass-highlight: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
            --text: #FFFFFF;
            --muted: #9BB0CC;
            --max: 520px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: 'Manrope', sans-serif;
            overflow-x: hidden;
            background: var(--bg);
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(circle at 75% 15%, rgba(0, 201, 255, 0.12), transparent 45%),
                radial-gradient(circle at 25% 85%, rgba(255, 255, 255, 0.04), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(8, 31, 59, 1), transparent 70%);
            animation: bgPulse 14s infinite alternate;
        }

        @keyframes bgPulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.15);
                opacity: 1;
            }
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .shell {
            width: min(100%, var(--max));
            margin: auto;
            padding: 22px 18px 34px;
            position: relative;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 30px;
            animation: fadeDown 0.8s ease both;
        }

        /* ✅ شعار Orbex مكبر جداً الآن */
        .brand {
            height: 95px;          /* زيادة كبيرة */
            width: auto;
            max-width: 300px;      /* زيادة كبيرة */
            object-fit: contain;
            filter: drop-shadow(0 2px 12px rgba(0, 0, 0, 0.8));
        }

        .live {
            font-size: 10px;
            letter-spacing: 0.17em;
            text-transform: uppercase;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(0, 0, 0, 0.45);
            padding: 6px 12px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .live i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--brand-accent);
            box-shadow: 0 0 14px var(--brand-accent);
            animation: pulse 1.8s infinite;
        }

        .hero {
            position: relative;
            border-radius: 36px;
            padding: 12px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
            animation: float 6s ease-in-out infinite;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 36px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 45%);
            opacity: 0.25;
            z-index: -1;
        }

        .photo-wrap {
            position: relative;
            height: 360px;
            border-radius: 26px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
        }

        .photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 16%;
            transform: scale(1.02);
        }

        .photo-wrap::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 50%, rgba(8, 31, 59, 0.92) 100%);
        }

        .hero-copy {
            padding: 24px 12px 15px;
            transform: translateZ(40px);
        }

        .eyebrow {
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(36px, 10vw, 54px);
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin: 0 0 12px;
            font-weight: 700;
            color: #fff;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 4px;
        }

        .role {
            font-size: 15px;
            color: var(--muted);
        }

        .role strong {
            color: #fff;
            font-weight: 600;
        }

        .accent {
            color: var(--brand-accent);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 22px;
            transform: translateZ(30px);
        }

        .btn {
            min-height: 52px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            font-weight: 600;
            font-size: 13px;
            font-family: 'Manrope', sans-serif;
            cursor: pointer;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.10);
        }

        .btn.primary {
            background: var(--brand-accent);
            border: none;
            box-shadow: 0 10px 30px rgba(0, 201, 255, 0.25);
            color: #081F3B;
        }

        .btn.primary:hover {
            background: var(--brand-accent-hover);
            box-shadow: 0 15px 40px rgba(0, 201, 255, 0.45);
            transform: translateY(-2px);
            color: #081F3B;
        }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            color: #fff;
        }

        .btn.secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .save-btn {
            grid-column: span 2;
        }

        .icon {
            width: 17px;
            height: 17px;
            display: block;
        }

        .section {
            margin-top: 22px;
            padding: 10px;
            border-radius: 28px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
            position: relative;
            overflow: hidden;
        }

        .section::before {
            content: "";
            position: absolute;
            left: 20px;
            right: 20px;
            top: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.20), transparent);
        }

        .social-title {
            padding: 12px 14px 10px;
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
        }

        .socials {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 0 4px 8px;
        }

        .social {
            min-height: 70px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            font-size: 9px;
            color: var(--muted);
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .social::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 20%, rgba(0, 201, 255, 0.12) 50%, transparent 80%);
            transform: translateX(-120%);
            transition: transform 0.7s ease;
        }

        .social:hover::before {
            transform: translateX(120%);
        }

        .social:hover {
            background: rgba(0, 201, 255, 0.08);
            border-color: var(--brand-accent);
            transform: translateY(-5px);
            color: #fff;
        }

        .social svg {
            width: 20px;
            height: 20px;
            color: #fff;
            filter: drop-shadow(0 0 5px rgba(0, 201, 255, 0.2));
        }

        .info {
            display: grid;
            gap: 6px;
            margin-top: 4px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 14px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .row:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--glass-border);
            transform: translateX(4px);
        }

        .row-icon {
            flex: 0 0 42px;
            height: 42px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.13em;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .value {
            font-size: 14px;
            color: #fff;
            font-weight: 500;
            word-break: break-word;
        }

        .chev {
            margin-left: auto;
            color: var(--muted);
            font-size: 20px;
            font-weight: 300;
        }

        .footer {
            text-align: center;
            padding: 26px 10px 4px;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 500;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotateX(0deg) rotateY(0deg);
            }
            50% {
                transform: translateY(-12px) rotateX(0deg) rotateY(0deg);
            }
        }

        @keyframes pulse {
            50% {
                opacity: 0.4;
                transform: scale(0.75);
            }
        }

        @keyframes fadeDown {
            0% {
                opacity: 0;
                transform: translateY(-18px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .scroll-section .reveal {
            opacity: 0;
            transform: translateY(30px) scale(0.98);
            filter: blur(4px);
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1),
                transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1),
                filter 0.8s ease;
        }

        .scroll-section .reveal.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        .scroll-section .divider {
            height: 1px;
            margin: 10px 10px 6px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transform: scaleX(0);
            transform-origin: center;
            transition: transform 0.9s ease;
        }

        .scroll-section.in-view .divider {
            transform: scaleX(1);
        }

        /* ✅ تكبير إضافي للشعار على الهواتف */
        @media (max-width: 450px) {
            .photo-wrap {
                height: 300px;
            }
            .socials {
                grid-template-columns: repeat(2, 1fr);
            }
            .social[style*="grid-column"] {
                grid-column: span 2 !important;
            }
            .actions {
                grid-template-columns: 1fr;
            }
            .save-btn {
                grid-column: span 1;
            }
            /* ✅ تم تكبير الشعار أكثر في التلفون */
            .brand {
                height: 82px;        /* كانت 48px */
                max-width: 250px;    /* كانت 160px */
            }
        }
    </style>
</head>
<body>

    <script>
        const tiltElement = document.getElementById('tiltElement');
        tiltElement.style.transformStyle = 'preserve-3d';

        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                const x = (window.innerWidth / 2 - e.clientX) / 25;
                const y = (window.innerHeight / 2 - e.clientY) / 25;
                tiltElement.style.transform = `rotateX(${y}deg) rotateY(${x}deg)`;
            }
        });

        document.addEventListener('mouseleave', () => {
            tiltElement.style.transform = `rotateX(0deg) rotateY(0deg)`;
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    entry.target.closest('.scroll-section')?.classList.add('in-view');
                } else {
                    entry.target.classList.remove('visible');
                    entry.target.closest('.scroll-section')?.classList.remove('in-view');
                }
            });
        }, {
            threshold: 0.14,
            rootMargin: "0px 0px -8% 0px"
        });

        document.querySelectorAll('.scroll-section .reveal').forEach(el => observer.observe(el));
        const section = document.querySelector('.scroll-section');
        if (section) observer.observe(section);
    </script>
</body>
